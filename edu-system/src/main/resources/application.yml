server:
  port: 8082

spring:
  application:
    name: edu-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/edu_platform?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PWD:your_password}
    type: com.alibaba.druid.pool.DruidDataSource
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PWD:your_password}
      database: 0
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        enabled: false
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yml
        import-check:
          enabled: false

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 鏂囦欢涓婁紶閰嶇疆锛堟湰鍦板瓨鍌紝鍙垏鎹inIO锛?file:
  upload:
    path: ${FILE_UPLOAD_PATH:C:/edu-uploads}

# 鍐呴儴鏈嶅姟璋冪敤鍦板潃
service:
  agent:
    url: ${AGENT_URL:http://localhost:8083}

logging:
  level:
    com.eduplatform: debug

service:
  agent:
    url: ${AGENT_SERVICE_URL:http://localhost:8083}
    connect-timeout: ${AGENT_CONNECT_TIMEOUT:5s}
    read-timeout: ${AGENT_READ_TIMEOUT:120s}



